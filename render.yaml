services:
  - type: web
    name: canon-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy alembic psycopg2-binary argon2-cffi pyjwt rapidfuzz httpx python-dotenv
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: LLM_PROVIDER
        value: mock
      - key: BACKEND_CORS_ORIGINS
        value: '["https://canon-web.vercel.app", "http://localhost:3000"]'
